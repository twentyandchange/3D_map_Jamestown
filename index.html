<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jamestown_buildings_elevation_2</title>
<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
<link rel="stylesheet" type="text/css" href="./Qgis2threejs.css">
<style type="text/css">
#popup, #header, #layerpanel {
  left: 36px;
}
/* Custom Legend Styles */
#legend-container {
    position: fixed;
    top: 90px;          /* Distance from top */
    left: 30px;         /* Distance from left */
    z-index: 1001;      /* Ensures it stays above the map */
    background: rgba(255, 255, 255, 0.8); /* White with 80% transparency */
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    pointer-events: none; /* Allows you to click "through" the legend to the map */
}

#legend-container img {
    display: block;
    width: 400px;       /* Default width for desktop */
    max-width: 35vw;    /* Responsive: image will never exceed 35% of screen width */
    height: auto;       /* Maintains aspect ratio */
}

/* Mobile specific adjustment */
@media (max-width: 600px) {
    #legend-container {
        display: none;  /* Hides the entire legend container on mobile */
    }
}

/* Title styles */
#title {
    position: absolute;
    top: 30px;
    left: 20px;
    z-index: 100;
    color: #da251c;
    font-size: 28px;
    font-family: Sans-serif;
    font-weight: bold;
    background-color: rgba(255, 255, 255, 0.8);
    padding: 10px 20px;
    border-radius: 5px;
}

/* Hide full title on mobile */
#title .full-title {
    display: inline;
}

#title .mobile-title {
    display: none;
}

/* Mobile adjustments */
@media (max-width: 600px) {
    #title {
        font-size: 14px;  /* Smaller font for mobile */
        padding: 5px 10px; /* Less padding */
        top: 10px;
        left: 10px;
    }
    
    #title .full-title {
        display: none;  /* Hide full title */
    }
    
    #title .mobile-title {
        display: inline;  /* Show mobile title */
    }
}
</style>

<script src="./threejs/three.min.js"></script>
<script src="./threejs/OrbitControls.js"></script>
<script src="./threejs/ViewHelper.js"></script>
<script src="./Qgis2threejs.js"></script>
<script src="./threejs/loaders/GLTFLoader.js"></script>
</head>


<body>
  <div id="title">
    <span class="full-title">Proximity of Tobacco Retailers to Jamestown's Children and Youth</span>
    <span class="mobile-title">Tobacco Retailers' Proximity to Residents < 21years old<br>(Darker shading = more youth residents)</span>
  </div>
  
  <div id="legend-container">
    <img src="legend_x.png" alt="Map Legend">
  </div>
  <div id="view">
    <div id="northarrow"></div>
    <div id="navigation"></div>
  </div>
</body>

<!-- progress bar -->
<div id="progress"><div id="progressbar"></div>

<!-- header and footer -->
<div id="header"></div>
<div id="footer"></div>

<!-- animation -->
<div id="narrativebox" class="ef1">
  <div id="narbody">
  </div>
</div>

<script>
Q3D.Config.allVisible = true;
Q3D.Config.viewpoint = {lookAt:{x:-8820746.33152434,y:5175859.799972035,z:0.0},pos:{x:-8820746.33152434,y:5170234.670829302,z:1931.4609516385274}};

var container = document.getElementById("view"),
    app = Q3D.application,
    gui = Q3D.gui;

app.init(container);       // initialize viewer

// load the scene
app.loadSceneFile("./data/index/scene.json", function (scene) {
  // scene file has been loaded
  app.start();

  // --- ADD THESE LINES TO LIMIT ROTATION ---
  app.controls.maxPolarAngle = Math.PI / 2.7; // Prevents looking under the map (90 degrees)
  app.controls.minPolarAngle = 0;           // Prevents flipping over the top
  // ------------------------------------------

}, function (scene) {
  // all relevant files have been loaded
});
</script>
